# ===============================
# 1. KONFIGURASI REST API SERVER
# ===============================
# Mengatur port tempat aplikasi berjalan (default biasanya 8080)
server.port=33400

# ===============================
# 2. KONFIGURASI DATABASE SQL (H2 In-Memory)
# ===============================
# Menggunakan H2 agar tidak perlu repot install MySQL/PostgreSQL saat tahap testing
spring.datasource.url=jdbc:h2:mem:midascore_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate (ORM) akan otomatis membuatkan tabel berdasarkan kode Java (mirip fitur Migrate)
spring.jpa.hibernate.ddl-auto=update

# Mengaktifkan konsol web untuk melihat isi database H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# 3. KONFIGURASI KAFKA
# ===============================
# Alamat server Kafka lokal
spring.kafka.bootstrap-servers=localhost:9092
# Nama grup untuk layanan Midas Core yang akan membaca pesan/transaksi
spring.kafka.consumer.group-id=midas-group
# Jika ada transaksi masuk saat aplikasi mati, baca dari pesan paling awal yang belum diproses
spring.kafka.consumer.auto-offset-reset=earliest

# ===============================
# 4. KONFIGURASI TOPIK KAFKA
# ===============================
# Nama topik Kafka yang digunakan oleh KafkaProducer
general.kafka-topic=merchant-updates

# Serializer untuk Producer (mengirim objek Transaction sebagai JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Deserializer untuk Consumer (membaca JSON menjadi objek Transaction)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
